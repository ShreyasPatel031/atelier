        let AVAILABLE_REPOS = [];
        
        async function fetchAvailableRepos() {
            try {
                const url = new URL('repos/index.json', window.location.href);
                const res = await fetch(url.toString(), { cache: 'no-store' });
                if (res.ok) {
                    const list = await res.json();
                    if (Array.isArray(list) && list.length > 0) return list;
                }
            } catch (e) { /* ignore */ }
            return [repoPath];
        }
        
        function populateRepoDropdown() {
            const dropdown = document.getElementById('repoDropdown');
            if (!dropdown) return;
            
            dropdown.innerHTML = '<option value="">Switch Repo...</option>';
            (AVAILABLE_REPOS.length ? AVAILABLE_REPOS : [repoPath]).forEach(repo => {
                const option = document.createElement('option');
                option.value = repo;
                option.textContent = repo;
                if (repo.toLowerCase() === repoPath.toLowerCase()) option.selected = true;
                dropdown.appendChild(option);
            });
        }
        
        function switchRepo(newRepo) {
            if (!newRepo || newRepo === repoPath) return;
            
            // Navigate to new repo
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('repo', newRepo);
            window.location.href = currentUrl.toString();
        }
        
        // ============================================================
        // INITIALIZATION
        // ============================================================
        
        async function init() {
            // #region debug log
            fetch('http://127.0.0.1:7252/ingest/89321c4d-4131-400e-85e5-638c214fd672',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'viewer.html:2101',message:'init() called',data:{stack:new Error().stack.split('\n').slice(1,4).join('|')},timestamp:Date.now(),runId:'debug',hypothesisId:'A'})}).catch(()=>{});
            // #endregion
            AVAILABLE_REPOS = await fetchAvailableRepos();
            
            // When no ?repo= in URL, redirect to first repo so something always loads
            if (!urlParams.get('repo')) {
                if (AVAILABLE_REPOS.length > 0) {
                    const first = AVAILABLE_REPOS[0];
                    window.location.replace(window.location.pathname + '?repo=' + encodeURIComponent(first));
                    return;
                }
            }
            
            const success = await loadAllData();
            if (!success) {
                const repoList = AVAILABLE_REPOS.length ? AVAILABLE_REPOS.join(', ') : 'none';
                const errHtml = `<div class="error" style="padding:1rem;max-width:480px;">
                    <p><strong>Failed to load repository data</strong></p>
                    <p>Path tried: <code>${basePath}</code></p>
                    <p>Serve this app from the <strong>demo</strong> folder (e.g. <code>cd demo && python -m http.server 8080</code>) so that <code>viewer.html</code> and <code>repos/</code> are at the same level.</p>
                    <p>Then open: <a href="?repo=KubeElasti">viewer.html?repo=KubeElasti</a> or pick a repo from the dropdown.</p>
                    <p>Available repos: ${repoList || '—'}</p>
                </div>`;
                document.getElementById('mermaid-diagram').innerHTML = errHtml;
                populateRepoDropdown();
                return;
            }
            
            buildModuleData();
            
            populateRepoDropdown();
            
            // Initialize zoom/pan
            initZoomPan();
            
            // Initialize with overview
            currentModuleId = 'overview';
            baseDiagramCode = moduleData['overview']?.diagram || '';
            currentDiagramCode = baseDiagramCode;
            
            // Initialize opened modules (overview is always open)
            openedModules.clear();
            openedModules.add('overview');
            console.log('[MODULE TRACKING] Initialized, opened modules:', Array.from(openedModules));
            
            // Initialize selection and breadcrumb
            updateSelection('overview');
            
            // #region debug log
            fetch('http://127.0.0.1:7252/ingest/89321c4d-4131-400e-85e5-638c214fd672',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'viewer.html:2149',message:'init() completed - state snapshot',data:{currentModuleId,expandedNodesSize:expandedNodes.size,openedModulesSize:openedModules.size,openedModulesArray:Array.from(openedModules)},timestamp:Date.now(),runId:'debug',hypothesisId:'A'})}).catch(()=>{});
            // #endregion
            
            renderDiagram(currentDiagramCode, overviewLinks, 'overview');
        }
        
        // Track URL changes
        window.addEventListener('popstate', () => {
            // #region debug log
            fetch('http://127.0.0.1:7252/ingest/89321c4d-4131-400e-85e5-638c214fd672',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'viewer.html:2152',message:'popstate event (browser back/forward)',data:{url:window.location.href,currentModuleId,expandedNodesSize:expandedNodes.size},timestamp:Date.now(),runId:'debug',hypothesisId:'G'})}).catch(()=>{});
            // #endregion
        });
        
        // Track hash changes
        window.addEventListener('hashchange', () => {
            // #region debug log
            fetch('http://127.0.0.1:7252/ingest/89321c4d-4131-400e-85e5-638c214fd672',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'viewer.html:2158',message:'hashchange event',data:{url:window.location.href,currentModuleId,expandedNodesSize:expandedNodes.size},timestamp:Date.now(),runId:'debug',hypothesisId:'G'})}).catch(()=>{});
            // #endregion
        });
        
        // Periodic state snapshot to catch unexpected resets
        setInterval(() => {
            // #region debug log
            fetch('http://127.0.0.1:7252/ingest/89321c4d-4131-400e-85e5-638c214fd672',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'viewer.html:2165',message:'periodic state snapshot',data:{currentModuleId,expandedNodesSize:expandedNodes.size,openedModulesSize:openedModules.size,openedModulesArray:Array.from(openedModules),url:window.location.href},timestamp:Date.now(),runId:'debug',hypothesisId:'H'})}).catch(()=>{});
            // #endregion
        }, 2000); // Every 2 seconds
        
        // Start
        init().catch(err => {
            console.error('Init failed:', err);
            document.body.innerHTML = `<div style="padding:20px;color:red;">Error: ${err.message}</div>`;
        });
        
        // ============================================================
        // CHAT PANEL (Architectural Agent)
        // ============================================================
        const chatInput = document.getElementById('chatInput');
        const chatSend = document.getElementById('chatSend');
        const chatMessages = document.getElementById('chatMessages');
        
        // API base: when on port 8080 (static demo server), use FastAPI on 8000; else same origin
        const CHAT_API_BASE = (window.location.port === '8080') ? 'http://127.0.0.1:8001' : '';
        
        function getChatJobId() {
            return (typeof repoPath !== 'undefined' ? repoPath : urlParams.get('repo') || 'search-agents');
        }

        // Conversation history for multi-turn chat (send back to API each time)
        let chatHistory = null;

        function addChatMessage(content, type) {
            const el = document.createElement('div');
            el.className = `chat-message ${type}`;
            if (type === 'assistant') {
                el.innerHTML = marked.parse(content);
            } else {
                el.textContent = content;
            }
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return el;
        }
        
        async function sendChatMessage() {
            if (!chatInput.value.trim()) return;
            const msg = chatInput.value.trim();
            chatInput.value = '';
            addChatMessage(msg, 'user');
            const loadingEl = addChatMessage('Thinking...', 'loading');
            chatSend.disabled = true;
            try {
                const jobId = getChatJobId();
                // Get opened modules as array (overview is always included)
                const openedModulesArray = Array.from(openedModules);
                console.log('[MODULE TRACKING] Sending chat request with opened modules:', openedModulesArray);
                
                const res = await fetch(`${CHAT_API_BASE}/api/arch-agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_id: jobId,
                        message: msg,
                        current_page: (typeof selectedModuleId !== 'undefined' ? selectedModuleId : null) || (typeof currentModuleId !== 'undefined' ? currentModuleId : null),
                        current_module: (typeof selectedModuleId !== 'undefined' ? selectedModuleId : null),
                        opened_modules: openedModulesArray,
                        history: chatHistory
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                chatHistory = data.history != null ? data.history : null;
                loadingEl.remove();
                addChatMessage(data.response || 'No response.', 'assistant');
            } catch (e) {
                loadingEl.remove();
                const hint = e.message === 'Failed to fetch' || e.message === 'Load failed'
                    ? 'Could not reach chat API. Start the CodeWiki server: cd atelier && python3 -m codewiki.run_web_app --port 8001'
                    : (e.message || 'Could not reach chat API. Is the CodeWiki server running on port 8001?');
                addChatMessage('Error: ' + hint, 'assistant');
            } finally {
                chatSend.disabled = false;
                chatInput.focus();
            }
        }
        
        chatSend.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
        });
    </script>
