<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="24" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- top-left node -->
    <rect x="18" y="22" width="28" height="18" rx="4" fill="#1E293B"/>
    <!-- top-right node -->
    <rect x="82" y="22" width="28" height="18" rx="4" fill="#1E293B"/>
    <!-- bottom-left node -->
    <rect x="18" y="88" width="28" height="18" rx="4" fill="#1E293B"/>
    <!-- bottom-right node -->
    <rect x="82" y="88" width="28" height="18" rx="4" fill="#1E293B"/>
    <!-- center node (larger) -->
    <rect x="42" y="49" width="44" height="30" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="3.5"/>
    <!-- edges -->
    <line x1="46" y1="31" x2="58" y2="49" opacity="0.6"/>
    <line x1="82" y1="31" x2="70" y2="49" opacity="0.6"/>
    <line x1="46" y1="97" x2="58" y2="79" opacity="0.6"/>
    <line x1="82" y1="97" x2="70" y2="79" opacity="0.6"/>
  </g>
  <!-- "A" letterform -->
  <text x="64" y="71" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">A</text>
</svg>
